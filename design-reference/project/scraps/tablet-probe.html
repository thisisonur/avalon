<!doctype html>
<html><head><meta charset="utf-8"><title>tablet probe</title>
<style>
  body { margin:0; background:#222; color:#fff; font: 12px/1.4 system-ui; }

  .row > div { background:#111; padding:8px; }
  iframe { display:block; border:1px solid #444; background:#fff; }
</style></head>
<body>
<div class="row">
  <div>
    <div>1024 × 768 (tablet landscape)</div>
    <iframe src="../index.html" width="1024" height="900"></iframe>
  </div>
  <div>
    <div>820 × 1180 (tablet portrait, iPad Air)</div>
    <iframe src="../index.html" width="820" height="900"></iframe>
  </div>
  <div>
    <div>900 × 1200 (mid tablet)</div>
    <iframe src="../index.html" width="900" height="900"></iframe>
  </div>
</div>
</body></html>
