<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>onurerdem.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600&family=Inter&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100dvh;
      background-color: #f4f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── UC Card ─────────────────────────────── */
    .uc-card {
      background-color: #e1e7e4;
      border-radius: 24px;
      padding: 24px;
      width: 248px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Inner column: icon row + text, space-between */
    .card-inner {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 183px;
    }

    /* Top row: icon + horizontal rule */
    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .icon {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
      display: block;
    }

    .top-line {
      flex: 1;
      height: 1px;
      background-color: #b8c4c0;
    }

    /* Text block */
    .card-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .domain {
      font-family: 'Crimson Pro', Georgia, serif;
      font-weight: 600;
      font-size: 28px;
      line-height: 32px;
      letter-spacing: -0.01em;
      color: #4b4f4d;
    }

    .subtitle {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 400;
      font-size: 16px;
      line-height: 25px;
      color: #4b4f4d;
    }

    /* Bottom rule */
    .bottom-line {
      height: 1px;
      background-color: #b8c4c0;
      width: 200px;
    }

    /* ── Responsive ──────────────────────────── */
    @media (max-width: 320px) {
      .uc-card {
        width: calc(100vw - 48px);
      }
      .bottom-line {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="uc-card">

    <div class="card-inner">

      <div class="card-top">
        <img
          class="icon"
          src="https://www.figma.com/api/mcp/asset/a4f3ae75-a376-4a1f-b98b-52eb9402ba95"
          alt=""
        >
        <div class="top-line"></div>
      </div>

      <div class="card-body">
        <p class="domain">onurerdem.com</p>
        <p class="subtitle">Currently rebuilding.<br>Check back soon!</p>
      </div>

    </div>

    <div class="bottom-line"></div>

  </div>

</body>
</html>
